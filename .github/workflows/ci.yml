name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Many color libraries just need this to be set to any value, but at least
  # one distinguishes color depth, where "3" -> "256-bit color".
  FORCE_COLOR: 3
  PROJECT_NAME: "ca_biositing"

jobs:
  harness:
    name: Check agent harness invariants
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Install pixi only. Installing the environment from pixi.lock first
      # would re-solve a lock that this pinned pixi cannot read, hiding the
      # failure that tests/agent_harness/test_lockfile.py reports.
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.63.2
          run-install: false

      - name: Check agent harness invariants
        run:
          pixi exec --spec "python=3.12" --spec pytest --spec pyyaml -- python
          -m pytest tests/agent_harness -v

  checks:
    name: Check Python ${{ matrix.python-version }} on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["py312", "py313"]
        runs-on: [ubuntu-latest, macos-14]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.63.2
          environments: ${{ matrix.python-version }}

      - name: Print pixi version
        run: pixi --version

      - name: Test ca_biositing.datamodels
        run: |
          pixi run pytest src/ca_biositing/datamodels --cov=ca_biositing.datamodels --cov-report=xml --cov-append --cov-report=term-missing

      - name: Test ca_biositing.pipeline
        run: |
          pixi run pytest src/ca_biositing/pipeline --cov=ca_biositing.pipeline --cov-report=xml --cov-append --cov-report=term-missing

      - name: Test ca_biositing.webservice
        run: |
          pixi run pytest src/ca_biositing/webservice -m "not integration" --cov=ca_biositing.webservice --cov-report=xml --cov-append --cov-report=term-missing

      - name: Upload coverage report
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
